services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kja_laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    networks:
      - kja-network

  web:
    image: nginx:alpine
    container_name: kja_laravel_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kja-network

networks:
  kja-network:
    driver: bridge
