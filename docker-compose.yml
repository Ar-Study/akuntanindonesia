services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akuntan_laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - akuntan-network

  web:
    image: nginx:alpine
    container_name: akuntan_laravel_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - akuntan-network

  db:
    image: mysql:8.0
    container_name: akuntan_laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: akuntanindonesia
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - akuntan-db-data:/var/lib/mysql
    networks:
      - akuntan-network

volumes:
  akuntan-db-data:
    driver: local

networks:
  akuntan-network:
    driver: bridge

